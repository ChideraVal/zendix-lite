name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          echo "Pinging $RENDER_HEALTH_URL"
          curl \
            --silent \
            --show-error \
            --write-out "\nHTTP Status: %{http_code}\n" \
            "$RENDER_HEALTH_URL"