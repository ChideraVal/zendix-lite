<head>

    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/common.css">

</head>

<body>
    <nav class="navbar">

        <div class="navbar-inner">

            <a href="jobs.html" class="navbar-logo">
                Zendix Lite

            <button id="menuButton" class="menu-button" aria-label="Toggle navigation">

                ☰

            </button>

            <div id="navLinks" class="nav-links">

                <a href="jobs.html" data-page="jobs">
                    Jobs
                </a>

                <a href="schemas.html" data-page="schemas">
                    Schemas
                </a>

                <a href="settings.html" data-page="settings">
                    Settings
                </a>

            </div>

        </div>

    </nav>

    <main class="page">

        <!-- ===================================================== -->
        <!-- Page Header -->
        <!-- ===================================================== -->

        <section class="page-header">

            <div>

                <h1>
                    Extracted Data Table
                </h1>

                <p>
                    Preview how your extracted data will appear when exported to CSV.
                </p>

            </div>

            <!-- <button id="newExtractionBtn" class="primary-btn">
                New Extraction
            </button> -->

            <!-- <a href="upload.html" class="primary-btn">
                New Extraction
            </a> -->

        </section>

        <div class="controls">
            <div>

                <label class="small">Row source
                    <select id="rowSourceSelect" class="select"></select>
                </label>

                <!-- <label class="small">Approval
                    <select id="approvalSelect" class="select">
                        <option value="all">All</option>
                        <option value="approved">Approved</option>
                        <option value="not_approved">Not approved</option>
                    </select>
                </label> -->

                <label class="small">Flatten depth
                    <input id="depthInput" class="select" type="number" min="1" max="5" value="1" style="width:72px" />
                </label>

                <label class="small">Page size
                    <input id="pageSizeInput" class="select" type="number" min="1" max="1000" value="50"
                        style="width:80px" />
                </label>
            </div>

            <div class="controls-right">
                <button id="refreshBtn" class="button">Review</button>
                <button id="columnsBtn" class="button">Columns</button>
                <button id="exportBtn" class="button">Export CSV</button>
            </div>
        </div>

        <div class="small muted" id="infoBar" style="margin-bottom: 1em;">Loading...</div>

        <div class="table-wrap" id="tableWrap">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="bottom">
            <div class="small muted" id="pagerInfo"></div>
            <div>
                <button id="prevBtn" class="button">Previous</button>
                <button id="nextBtn" class="button">Next</button>
            </div>
        </div>
        </div>

    </main>

    <!-- Column modal -->

        <div class="panel">
            <h3>Columns</h3>

                <button id="colCancelBtn" class="button"
                    style="border: 1px solid #e6eef9; color: #0f172a; background: transparent; margin-right: .5em;">Cancel</button>
                <button id="colApplyBtn" class="button">Apply</button>
            </div>
        </div>
    </div> -->

     <div id="colModal" class="modal">
        <div class="modal-card">
            <h3>Columns</h3>
            <div class="modal-body" id="colList"></div>
            <div class="modal-actions">
                <button id="colCancelBtn" class="secondary-btn">Cancel</button>
                <button id="colApplyBtn" class="primary-btn">Apply</button>
            </div>
        </div>
    </div>

    <!-- ==========================
        Toast
    ========================== -->

    <div id="toast" class="toast">

    </div>

    <script src="js/helpers/utils.js"></script>
    <script src="js/helpers/storage.js"></script>
    <script src="js/helpers/table-utils.js"></script>

    <script src="js/common.js"></script>
    <script src="js/table.js"></script>

</body>


</html>
