<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schemas - Zendix</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/schemas.css">
</head>

<body>

    <nav class="navbar">

        <div class="navbar-inner">

            <a href="jobs.html" class="navbar-logo">
                Zendix Lite
            </a>

            <button id="menuButton" class="menu-button" aria-label="Toggle navigation">

                ☰

            </button>

            <div id="navLinks" class="nav-links">

                <a href="jobs.html" data-page="jobs">
                    Jobs
                </a>

                <a href="schemas.html" data-page="schemas">
                    Schemas
                </a>

                <a href="settings.html" data-page="settings">
                    Settings
                </a>

            </div>

        </div>

    </nav>


    <div class="page">

        <!-- Page Header -->
        <div class="page-header">

            <div>
                <h1>Schemas</h1>
                <p class="page-subtitle">
                    Create and manage extraction schemas stored in your browser.
                </p>
            </div>

            <a href="create-schema.html" class="primary-btn">
                Create Schema
            </a>

        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state hidden">

            <div class="empty-icon">
                📄
            </div>

            <h2>No Schemas Yet</h2>

            <p>
                Create your first schema to define the information Zendix
                should extract from your documents.
            </p>

            <a href="create-schema.html" class="primary-btn">
                Create Schema
            </a>

        </div>

        <!-- Schema List -->
        <div id="schemaList" class="schema-grid"></div>

    </div>


    <!-- Delete Modal -->
    <div id="deleteModal" class="modal">

        <div class="modal-card">

            <h3>Delete Schema</h2>

            <div class="modal-body">

                <p>
                    This action cannot be undone.
                </h3>
                
            </div>
            
            <div class="modal-actions">

                <button
                    id="cancelDeleteBtn"
                    class="secondary-btn">
                    Cancel
                </button>

                <button
                    id="confirmDeleteBtn"
                    class="danger-btn">
                    Delete
                </button>

            </div>

        </div>

    </div>

    <!-- ==========================
        Toast
    ========================== -->

    <div
        id="toast"
        class="toast">

    </div>

    <script src="js/helpers/storage.js"></script>
    <script src="js/helpers/utils.js"></script>
    <script src="js/schemas.js"></script>
    <script src="js/common.js"></script>

</body>

</html>
